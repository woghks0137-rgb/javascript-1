<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 연습 01 </title>
</head>

<body>
    <h2 id="score">점수</h2>
    <button id="check">결과 확인</button>
    <p id="result">결과가 아직 없습니다.</p>
    <!-- ==================== 예제 1번 ================ -->

    <h2 id="score02">점수</h2>
    <button id="check02">등급 확인</button>
    <p id="result02">등급이 아직 없습니다.</p>

    <script>

        const score = document.querySelector("#score");
        const btn = document.querySelector("#check");
        const result = document.querySelector("#result");

        let score1 = 75

        btn.addEventListener("click", function () {
            score.innerHTML = score1
            if (score1 >= 60) {
                result.textContent = "합격입니다"
            } else {
                result.textContent = "불합격입니다."
            }
        })
        /* ==================== 예제 1번 ========================== */

        const score02 = document.querySelector("#score02");
        const check02 = document.querySelector("#check02");
        const result02 = document.querySelector("#result02");

        let score03 = 85;

        check02.addEventListener("click", () => {
            score02.textContent = score03;

            if (score03 >= 90) {
                result02.textContent = `${score03}점 A등급 입니다.`
            } else if (score03 >= 80) {
                result02.textContent = `${score03}점 B등급 입니다.`
            } else if (score03 >= 70) {
                result02.textContent = `${score03}점 C등급 입니다.`
            } else {
                result02.textContent = `${score03}점 F등급 입니다.`
            }
        })



    </script>
</body>

</html>
